services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudforge_demo
      POSTGRES_USER: cloudforge
      POSTGRES_PASSWORD: cloudforge
    ports:
      - "5432:5432"
    volumes:
      - cloudforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudforge -d cloudforge_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  application:
    build:
      context: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/cloudforge_demo
      DATABASE_USERNAME: cloudforge
      DATABASE_PASSWORD: cloudforge
      APP_VERSION: local-docker
      GIT_COMMIT: local
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - cloudforge-prometheus-data:/prometheus
    depends_on:
      application:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-cloudforge}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - cloudforge-grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  cloudforge-postgres-data:
  cloudforge-prometheus-data:
  cloudforge-grafana-data:
