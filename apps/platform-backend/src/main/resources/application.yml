server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: cloudforge-platform-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cloudforge_platform}
    username: ${DB_USERNAME:cloudforge}
    password: ${DB_PASSWORD:cloudforge}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus

  endpoint:
    health:
      probes:
        enabled: true

info:
  application:
    name: CloudForge Platform Backend
    version: 0.1.0

cloudforge:
  deployment:
    orchestrator: ${CLOUDFORGE_DEPLOYMENT_ORCHESTRATOR:mock}

  jenkins:
    base-url: ${JENKINS_BASE_URL:http://localhost:8081}
    username: ${JENKINS_USERNAME:}
    api-token: ${JENKINS_API_TOKEN:}
    job-name: ${JENKINS_JOB_NAME:cloudforge-release}
