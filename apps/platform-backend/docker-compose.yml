services:
  platform-db:
    image: postgres:16-alpine

    container_name: cloudforge-platform-db

    environment:
      POSTGRES_DB: cloudforge_platform
      POSTGRES_USER: cloudforge
      POSTGRES_PASSWORD: cloudforge

    ports:
      - "5433:5432"

    volumes:
      - cloudforge-platform-db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U cloudforge -d cloudforge_platform
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cloudforge-platform-db-data:
