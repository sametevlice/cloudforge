name: Demo Application CI

on:
  pull_request:
    paths:
      - "apps/demo-app/**"
      - "scripts/demo-smoke-test.sh"
      - "Makefile"
      - ".github/workflows/demo-app-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/demo-app/**"
      - "scripts/demo-smoke-test.sh"
      - "Makefile"
      - ".github/workflows/demo-app-ci.yml"

permissions:
  contents: read

concurrency:
  group: demo-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/demo-app/pom.xml
      - name: Validate Docker Compose
        run: docker compose config
      - name: Run Maven tests
        run: mvn --batch-mode clean verify

  docker:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: apps/demo-app
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag cloudforge-demo-app:${{ github.sha }} .
