name: Demo Application CI

on:
  pull_request:
    paths:
      - "apps/demo-app/**"
      - ".github/workflows/demo-app-ci.yml"

  push:
    branches:
      - main
    paths:
      - "apps/demo-app/**"
      - ".github/workflows/demo-app-ci.yml"

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: cloudforge-demo-app

jobs:
  test:
    name: Test Demo Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/demo-app

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/demo-app/pom.xml

      - name: Validate Docker Compose
        run: docker compose config

      - name: Run Maven tests
        run: mvn --batch-mode clean verify

  docker-build:
    name: Validate Docker Image
    if: github.event_name == 'pull_request'
    needs:
      - test

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/demo-app

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            --tag cloudforge-demo-app:${{ github.sha }} \
            .

  publish-ecr:
    name: Publish Image to Amazon ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: apps/demo-app

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cloudforge-github-actions

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            .

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Show published image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Published image:"
          echo "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
