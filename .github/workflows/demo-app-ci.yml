name: Demo Application CI

on:
  pull_request:
    paths:
      - "apps/demo-app/**"
      - ".github/workflows/demo-app-ci.yml"

  push:
    branches:
      - main
    paths:
      - "apps/demo-app/**"
      - ".github/workflows/demo-app-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/demo-app

jobs:
  test:
    name: Test Demo Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/demo-app/pom.xml

      - name: Run Maven tests
        run: mvn --batch-mode clean verify

  docker:
    name: Build Demo Application Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag cloudforge-demo-app:${{ github.sha }} .


	





