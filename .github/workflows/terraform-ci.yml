name: Terraform CI

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches:
      - main
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format and Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Check formatting
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Initialize bootstrap without backend
        run: terraform -chdir=infrastructure/terraform/bootstrap init -backend=false

      - name: Validate bootstrap
        run: terraform -chdir=infrastructure/terraform/bootstrap validate

      - name: Initialize development without backend
        run: terraform -chdir=infrastructure/terraform/environments/development init -backend=false

      - name: Validate development
        run: terraform -chdir=infrastructure/terraform/environments/development validate

      - name: Initialize staging without backend
        run: |
          terraform \
            -chdir=infrastructure/terraform/environments/staging \
            init -backend=false

      - name: Validate staging
        run: |
          terraform \
            -chdir=infrastructure/terraform/environments/staging \
            validate

      - name: Initialize production without backend
        run: |
          terraform \
            -chdir=infrastructure/terraform/environments/production \
            init -backend=false

      - name: Validate production
        run: |
          terraform \
            -chdir=infrastructure/terraform/environments/production \
            validate
