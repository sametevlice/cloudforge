name: Security CI

on:
  pull_request:
    paths:
      - "apps/**"
      - "infrastructure/**"
      - "tests/**"
      - ".github/workflows/security-ci.yml"
      - ".tflint.hcl"

  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "infrastructure/**"
      - "tests/**"
      - ".github/workflows/security-ci.yml"
      - ".tflint.hcl"

permissions:
  contents: read

jobs:
  terraform-lint:
    name: Terraform Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0
          cache: true

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: |
          tflint \
            --recursive \
            --chdir infrastructure/terraform \
            --format compact

  checkov:
    name: Checkov IaC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Checkov
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install checkov

      - name: Run Checkov
        run: |
          checkov \
            -d infrastructure/terraform \
            --framework terraform \
            --compact \
            --soft-fail

  trivy-secrets:
    name: Trivy Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.74.0

      - name: Scan repository secrets
        run: |
          trivy fs \
            --scanners secret \
            --offline-scan \
            --exit-code 1 \
            .

  trivy-iac:
    name: Trivy IaC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.74.0

      - name: Scan Terraform configuration
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            infrastructure/terraform

  container-security:
    name: Container Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.74.0

      - name: Build demo image
        run: |
          docker build \
            -t cloudforge-demo-app:security-ci \
            apps/demo-app

      - name: Scan demo image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            cloudforge-demo-app:security-ci
